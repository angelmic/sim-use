name: SimUsePlaygroundTV
options:
  bundleIdPrefix: com.cameroncooke
  deploymentTarget:
    tvOS: "18.0"

targets:
  SimUsePlaygroundTV:
    type: application
    platform: tvOS
    sources:
      - SimUsePlaygroundTV
    info:
      path: SimUsePlaygroundTV/Info.plist
      properties:
        CFBundleDisplayName: SimUsePlaygroundTV
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cameroncooke.SimUsePlaygroundTV
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
